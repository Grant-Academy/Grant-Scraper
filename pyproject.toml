[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grantscrape"
version = "0.1.0"
description = "URL in, verifiable grant-award table out. Deterministic CLI driven by Claude Code skills."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "lxml>=5",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "pdfplumber>=0.11",
    "pydantic>=2.6",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grantscrape = "grantscrape.cli:main"

[tool.setuptools.packages.find]
include = ["grantscrape*"]

[tool.setuptools.package-data]
grantscrape = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
